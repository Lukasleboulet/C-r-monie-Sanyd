<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAMP · District de Sandy Shore · Suivi & Cérémonies</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{if(localStorage.getItem('samp-sandy-shore-v1-mode')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
</head>
<body>
<div id="boot">
  <div class="blights"></div>
  <div class="bwrap">
    <div class="bring"><img src="assets/logo.png" alt=""></div>
    <div class="bname">Math<b>OS</b></div>
    <div class="bsub">San Andreas Police Department · Sandy Shore · MDT-07</div>
    <div class="bbarw"><i id="bbar"></i></div>
    <div class="blog" id="blog"></div>
  </div>
  <div class="bfoot">Accès réservé au personnel autorisé · Initialisation en cours…</div>
</div>
<div class="app">
  <header class="appbar">
    <div class="ab-brand">
      <img src="assets/logo.png" class="logo" alt="SAMP · District de Sandy Shore">
      <div><b>SAMP · Sandy Shore</b><span>Système de gestion · San Andreas Police Department</span></div>
    </div>
    <div class="ab-r">
      <span class="ab-clk"><i class="led" id="syled" data-s="ok" title="Synchronisé avec le serveur"></i><span id="clk"></span></span>
      <button class="ib" id="mode" type="button" aria-label="Basculer entre mode clair et mode sombre"><svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button class="btn out" id="lo"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Déconnexion</button>
      <div class="ucard" id="ucard"><div><b id="un">—</b><i id="ur">Utilisateur</i><i id="ud" class="dcn" hidden></i></div><span class="uav" id="uav">?</span></div>
    </div>
  </header>
  <div class="lights"></div>
  <div class="body">
    <aside class="side">
      <label class="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="sq" placeholder="Rechercher une page…" autocomplete="off"></label>
      <nav id="nav">
        <div class="sec">
          <button class="sh" type="button">Principal<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="items">
            <button data-t="eff" class="on"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.8 0 4.5 1.9 4.5 4.5"/></svg>Effectifs</button>
            <button data-t="hrs"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Heures</button>
            <button data-t="imp"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 20h16"/></svg>Importer</button>
            <button data-t="cer"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Cérémonie</button>
            <button data-t="sta"><svg viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2"/></svg>Statistiques</button>
          </div>
        </div>
        <div class="sec" id="gadm">
          <button class="sh" type="button">Administration<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="items">
            <button data-t="set" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Paramètres</button>
          </div>
        </div>
      </nav>
      <div class="sec">
        <button class="sh" type="button">Données &amp; compte<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="items">
          <button class="nb" id="bk"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 20h16"/></svg>Sauvegarde</button>
          <label class="nb"><svg viewBox="0 0 24 24"><path d="M12 15V3m0 0-4 4m4-4 4 4M4 20h16"/></svg>Restaurer<input type="file" id="rs" accept=".json" hidden></label>
          <button class="nb" id="rz"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>Réinitialiser</button>
          <button class="nb" id="pw"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9m-3 3 3 3"/></svg>Mon mot de passe</button>
        </div>
      </div>
      <div class="rolecard"><small>Rôle effectif</small><div><i class="dot"></i><b id="rn">—</b><em id="rl"></em></div></div>
    </aside>
    <div class="main">
      <header class="top">
        <div class="ttl"><span class="pic" id="pic"></span><div><h1 id="pt">Effectifs</h1><p id="psub"></p></div></div>
        <div class="kpis" id="kpi"></div>
      </header>
      <main id="view"></main>
    </div>
  </div>
</div>
<div class="modal" id="dm" hidden>
  <form class="mcard" id="df" autocomplete="off">
    <div class="mico"><svg id="dic" viewBox="0 0 24 24"></svg></div>
    <h3 id="dt"></h3><p id="dp"></p>
    <input id="di" class="dinp" type="text" autocomplete="off" hidden>
    <div class="mbtns"><button type="button" class="btn ghost" id="dc">Annuler</button><button type="submit" class="btn gold" id="dok">OK</button></div>
  </form>
</div>
<div id="login" hidden>
  <form class="mcard lcard" id="lf" autocomplete="off">
    <img src="assets/logo.png" class="llogo" alt="">
    <h3 id="lt">Connexion</h3>
    <p id="ls"></p>
    <div id="ldw"><button type="button" class="btn dc" id="ld"><svg viewBox="0 0 24 24"><path d="M7.2 6.2c1.6-.7 3.3-1 4.8-1s3.2.3 4.8 1l1.7 1.9c1.4 2.6 2 5.4 1.8 8.4-1.4 1.1-3.100 1.800-4.400 2.100l-1.100-1.700c.9-.2 1.700-.6 2.400-1.100-.2-.1-.5-.3-.7-.5-2.300 1-5.100 1-7.400 0-.2.200-.5.400-.7.500.7.500 1.500.900 2.400 1.100l-1.100 1.700c-1.300-.3-3-1-4.400-2.100-.2-3 .4-5.800 1.800-8.400z"/><circle cx="9.200" cy="12.600" r="1.300" fill="currentColor" stroke="none"/><circle cx="14.800" cy="12.600" r="1.300" fill="currentColor" stroke="none"/></svg>Se connecter avec Discord</button><div class="lsep"><span>ou avec un identifiant</span></div></div>
        <label class="fld">Identifiant<input id="lu" autocomplete="username"></label>
    <label class="fld">Mot de passe<input id="lp" type="password" autocomplete="current-password"></label>
    <label class="fld" id="lc" hidden>Confirmer le mot de passe<input id="lp2" type="password" autocomplete="new-password"></label>
    <label class="lrem"><input type="checkbox" id="lr"> Rester connecté sur cet appareil</label>
    <div class="merr" id="le"></div>
    <button class="btn gold lbtn" id="lb" type="submit">Se connecter</button>
  </form>
</div>
<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
